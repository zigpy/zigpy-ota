release_notes: |-
  - New Features

  1. Added support for double-click and long-press event reporting in Pulse Switch mode.
  2. Added support for the Zigbee Scenes cluster.
  3. Added support for the Zigbee On with Timed Off command.

  - Improvements

  1. Added a prerequisite for the External Switch to enter pairing mode: the device must have been offline for more than 2 minutes.
  2. Updated the trigger method for the External Switch to enter pairing mode:
  3. Pulse Switch: Press and hold for ≥10 seconds.
  4. Rocker Switch: Toggle the switch 6 times.

  - Bug Fixes

  1. Fixed known bugs and improved overall system stability.
