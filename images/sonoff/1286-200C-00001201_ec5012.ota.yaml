release_notes: |-
  This updates the Sonoff MINI-ZBRBS to firmware version 1.2.1.

  **Changes**
  - Improve the auto calibration success rate
  - Add single momentary switch mode, where a short press on either external switch input toggles open and close (pulse trigger mode only)
  - Add auto calibration from the external switch in pulse trigger mode: short press UP, short press DOWN, then press and hold UP or DOWN for 10 seconds
  - Improve the compensation time setting for manual calibration
  - Change the external switch pairing trigger: after the device has been offline for more than 2 minutes, toggle UP and DOWN back and forth at least 6 times within 6 seconds (edge trigger mode), or press UP at least 6 times within 6 seconds (pulse trigger mode)
  - Fix several known issues to improve stability
