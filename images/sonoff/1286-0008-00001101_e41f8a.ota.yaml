release_notes: |-
  Improvements
  1. Optimized External Switch Event Handling in Relay Detach + Follow Mode:
     - Gateway: The device now reports "ON" and "OFF" events to the gateway when the external switch is closed and opened, respectively. This supports momentary switches by distinguishing between press and release actions, enabling more responsive gateway automations.
     - Binding: The device now sends a "Toggle command" directly to the bound target device as soon as the external switch is pressed, improving control responsiveness.
  2. Optimized Event Queue: Improved event transmission speed for faster response.
