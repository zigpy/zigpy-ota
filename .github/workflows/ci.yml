name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request: ~
  merge_group: ~

jobs:
  shared-ci:
    uses: zigpy/workflows/.github/workflows/ci.yml@main
    with:
      CODE_FOLDER: zigpy_ota
      CACHE_VERSION: 1
      PYTHON_VERSION_DEFAULT: "3.14"
      PRE_COMMIT_CACHE_PATH: ~/.cache/pre-commit
      MINIMUM_COVERAGE_PERCENTAGE: 0
      PYTHON_MATRIX: '"3.14"'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
