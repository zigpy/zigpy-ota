name: Publish release assets and update version pointers

on:
  release:
    types:
      # `published` is triggered when a new release or pre-release is published, even from a draft
      - published
      # `released` is triggered when a pre-release is promoted to a release, but unfortunately also
      # when a new stable release is created (and not from a draft, according to docs)
      - released
  workflow_dispatch:
    inputs:
      # When triggered manually without inputs, recalculates and updates version pointers.
      # When triggered with a tag_name, updates version pointers for that release.
      tag_name:
        description: "Release tag name (leave empty to recalculate from latest releases)"
        required: false
        type: string
      is_prerelease:
        description: "Is this a pre-release?"
        required: false
        type: boolean
        default: false

concurrency:
  group: push-release-version
  cancel-in-progress: false

env:
  PYTHON_VERSION_DEFAULT: "3.14"
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  # For 'released' events (pre-release promoted to stable), re-trigger this workflow
  # using workflow_dispatch to ensure the latest workflow code is used.
  #
  # When a new stable release is created, both 'published' and 'released' events fire.
  # The 'published' event handles JSON generation and upload. If no JSON assets exist yet,
  # this is a duplicate trigger - skip and let 'published' handle everything.
  retrigger-on-released:
    name: Re-trigger workflow for promoted release
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      actions: write
    if: github.event.action == 'released' && contains(toJSON(github.event.release.assets.*.name), '.json')
    steps:
      - name: Trigger workflow_dispatch with release info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run publish-release-json.yml \
            --ref "$DEFAULT_BRANCH" \
            -f tag_name="$RELEASE_TAG" \
            -f is_prerelease="$RELEASE_PRERELEASE"
          echo "::notice::Re-triggered workflow via workflow_dispatch for release $RELEASE_TAG"

  # Generate index files in a read-only job to isolate OTA image parsing
  # from privileged upload/push operations
  generate-index:
    name: Generate OTA index files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Only run for 'published' events
    if: github.event.action == 'published'
    steps:
      # Shallow clone is sufficient — this job only reads files from the working tree.
      # Full history is only needed by update-version-pointers (which switches branches).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load schema config
        run: |
          set -euo pipefail
          {
            for key in $(jq -r 'keys[]' .github/SCHEMA.json); do
              value=$(jq -r --arg k "$key" '.[$k]' .github/SCHEMA.json)
              echo "SCHEMA_${key^^}=$value"
            done

            # Pre-compute temp output paths
            echo "TMP_ZIGPY=/tmp/$(jq -r '.zigpy_filename' .github/SCHEMA.json)"
            echo "TMP_Z2M=/tmp/$(jq -r '.z2m_filename' .github/SCHEMA.json)"
            echo "TMP_MARKDOWN=/tmp/$(jq -r '.markdown_filename' .github/SCHEMA.json)"
            echo "TMP_ZIGPY_BETA=/tmp/$(jq -r '.zigpy_beta_filename' .github/SCHEMA.json)"
            echo "TMP_Z2M_BETA=/tmp/$(jq -r '.z2m_beta_filename' .github/SCHEMA.json)"
            echo "TMP_MARKDOWN_BETA=/tmp/$(jq -r '.markdown_beta_filename' .github/SCHEMA.json)"
          } >> "$GITHUB_ENV"

      - name: Set up Python ${{ env.PYTHON_VERSION_DEFAULT }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install package
        run: uv sync --group ci

      - name: Generate zigpy JSON metadata (stable channel)
        run: |
          uv run zigpy-ota generate-index \
            --format zigpy \
            --channel stable \
            --output-file "$TMP_ZIGPY" \
            --tag "$RELEASE_TAG" \

      - name: Generate zigpy JSON metadata (beta channel)
        run: |
          uv run zigpy-ota generate-index \
            --format zigpy \
            --channel beta \
            --output-file "$TMP_ZIGPY_BETA" \
            --tag "$RELEASE_TAG" \

      - name: Generate Z2M JSON metadata (stable channel)
        run: |
          uv run zigpy-ota generate-index \
            --format z2m \
            --channel stable \
            --output-file "$TMP_Z2M" \
            --tag "$RELEASE_TAG" \

      - name: Generate Z2M JSON metadata (beta channel)
        run: |
          uv run zigpy-ota generate-index \
            --format z2m \
            --channel beta \
            --output-file "$TMP_Z2M_BETA" \
            --tag "$RELEASE_TAG" \

      - name: Generate markdown index (stable channel)
        run: |
          uv run zigpy-ota generate-index \
            --format markdown \
            --channel stable \
            --output-file "$TMP_MARKDOWN" \
            --tag "$RELEASE_TAG" \

      - name: Generate markdown index (beta channel)
        run: |
          uv run zigpy-ota generate-index \
            --format markdown \
            --channel beta \
            --output-file "$TMP_MARKDOWN_BETA" \
            --tag "$RELEASE_TAG" \

      # Likely redundant
      - name: Validate generated JSON files
        run: |
          set -euo pipefail
          for file in \
            "$TMP_ZIGPY" \
            "$TMP_ZIGPY_BETA" \
            "$TMP_Z2M" \
            "$TMP_Z2M_BETA"; do
            if [ ! -f "$file" ]; then
              echo "::error::JSON file was not generated at $file"
              exit 1
            fi

            # Validate JSON syntax
            if ! jq empty "$file" 2>/dev/null; then
              echo "::error::Generated JSON is not valid: $file"
              exit 1
            fi

            FILE_SIZE=$(stat -c%s "$file")
            echo "::notice::Generated $file ($FILE_SIZE bytes)"
          done

      - name: Validate generated markdown files
        run: |
          set -euo pipefail
          for file in \
            "$TMP_MARKDOWN" \
            "$TMP_MARKDOWN_BETA"; do
            if [ ! -f "$file" ]; then
              echo "::error::Markdown file was not generated at $file"
              exit 1
            fi

            FILE_SIZE=$(stat -c%s "$file")
            echo "::notice::Generated $file ($FILE_SIZE bytes)"
          done

      - name: Upload generated index files
        uses: actions/upload-artifact@v7
        with:
          name: release-index-files
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ env.TMP_ZIGPY }}
            ${{ env.TMP_ZIGPY_BETA }}
            ${{ env.TMP_Z2M }}
            ${{ env.TMP_Z2M_BETA }}
            ${{ env.TMP_MARKDOWN }}
            ${{ env.TMP_MARKDOWN_BETA }}

  upload-release-assets:
    name: Upload index files to release
    needs: [generate-index]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download generated index files
        uses: actions/download-artifact@v8
        with:
          name: release-index-files
          path: /tmp/release-files

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" /tmp/release-files/* --clobber

  update-version-pointers:
    name: Update version pointers (stable.json, beta.json)
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Run when:
    # - Release asset upload succeeds (published event)
    # - Upload was skipped (workflow_dispatch — no index generation needed)
    # Don't run if upload failed (would point to missing files)
    # Don't run for 'released' events (handled by retrigger-on-released job)
    needs: [upload-release-assets]
    if: ${{ !cancelled() &&
      github.event.action != 'released' &&
      (needs.upload-release-assets.result == 'success' || needs.upload-release-assets.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_ACCESS_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config --global user.name "zigpy-bot"
          git config --global user.email "247691930+zigpy-bot@users.noreply.github.com"

      # Make sure the script is executable:
      # git update-index --chmod=+x .github/scripts/update-version-pointers.sh
      - name: Update version pointers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          # Use inputs for workflow_dispatch, event data for release events
          RELEASE_TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.is_prerelease || github.event.release.prerelease }}
          RELEASE_CREATED_AT: ${{ github.event.release.created_at }}
          RELEASE_ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: .github/scripts/update-version-pointers.sh
